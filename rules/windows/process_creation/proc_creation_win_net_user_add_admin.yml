title: Local Account Created and Added to Administrators
id: 1b3ed0b7-6db1-40ef-a634-ff113c7a269b
status: stable
description: net.exe or net1.exe creating a local user or adding one to the local Administrators group.
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc771865(v=ws.11)
author: Example SOC
date: 2026-10-12
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
    selection_user_add:
        CommandLine|contains|all:
            - ' user '
            - ' /add'
    selection_group_add:
        CommandLine|contains|all:
            - ' localgroup administrators '
            - ' /add'
    condition: selection_img and 1 of selection_*_add
falsepositives:
    - Provisioning scripts run by IT
level: medium
